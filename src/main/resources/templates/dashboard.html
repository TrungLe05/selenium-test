<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Dashboard — Selenium Demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
        }
        .card {
            background: rgba(255,255,255,0.07);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.13);
            border-radius: 24px;
            padding: 48px 40px;
            text-align: center;
            color: #fff;
            animation: pop 0.4s cubic-bezier(0.16, 1, 0.3, 1) both;
        }
        @keyframes pop {
            from { opacity: 0; transform: scale(0.9); }
            to   { opacity: 1; transform: scale(1); }
        }
        .check { font-size: 56px; margin-bottom: 16px; }
        h1 { font-size: 26px; font-weight: 700; margin-bottom: 8px; }
        .sub { color: rgba(255,255,255,0.55); font-size: 15px; }
        .badge {
            display: inline-block;
            margin-top: 20px;
            padding: 6px 16px;
            background: linear-gradient(135deg, #7c3aed, #2563eb);
            border-radius: 99px;
            font-size: 13px;
            font-weight: 600;
        }
    </style>
</head>
<body>
<div class="card">
    <div class="check">✅</div>
    <h1>Đăng nhập thành công!</h1>
    <p class="sub">Chào mừng trở lại, <strong th:text="${username}">User</strong></p>
    <div class="badge">id="dashboard-message"</div>
    <!-- id trên dùng để Selenium tìm element khi verify -->
    <p id="dashboard-message" style="display:none" th:text="'Xin chào, ' + ${username}">hidden</p>
</div>
</body>
</html>

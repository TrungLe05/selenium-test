<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Đăng nhập — Selenium Demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
        }

        .card {
            width: 380px;
            background: #111111;
            border-radius: 16px;
            padding: 44px 36px;
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.3px;
            margin-bottom: 4px;
        }
        .subtitle {
            font-size: 13px;
            color: #8a8a8a;
            margin-bottom: 28px;
        }

        .form-group { margin-bottom: 16px; }

        label {
            display: block;
            font-size: 12.5px;
            font-weight: 500;
            color: #b5b5b5;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            background: #1c1c1c;
            border: 1px solid #333333;
            border-radius: 10px;
            font-size: 14px;
            color: #ffffff;
            outline: none;
            transition: border-color 0.15s;
            font-family: inherit;
        }
        input::placeholder { color: #666666; }
        input:focus { border-color: #ffffff; }

        .alert-error {
            background: #1c1c1c;
            border: 1px solid #555555;
            border-radius: 10px;
            padding: 11px 14px;
            margin-bottom: 18px;
            color: #ffffff;
            font-size: 13px;
        }

        .btn-login {
            width: 100%;
            padding: 13px;
            background: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            color: #111111;
            cursor: pointer;
            margin-top: 6px;
            transition: opacity 0.15s;
            font-family: inherit;
        }
        .btn-login:hover { opacity: 0.85; }
        .btn-login:active { opacity: 0.7; }

        .demo-hint {
            margin-top: 20px;
            padding: 10px 14px;
            background: #1c1c1c;
            border-radius: 8px;
            font-size: 12px;
            color: #777777;
            text-align: center;
            line-height: 1.6;
        }
        .demo-hint strong { color: #cccccc; }
    </style>
</head>
<body>

<div class="card">
    <h1>Đăng nhập</h1>
    <p class="subtitle">Nhập thông tin tài khoản để tiếp tục</p>

    <div class="alert-error" th:if="${error}">
        <span th:text="${error}">Lỗi đăng nhập</span>
    </div>

    <form th:action="@{/login}" th:object="${loginRequest}" method="post">

        <div class="form-group">
            <label for="username">Tên đăng nhập</label>
            <input
                    type="text"
                    id="username"
                    name="username"
                    th:field="*{username}"
                    placeholder="Nhập tên đăng nhập..."
                    autocomplete="username"
                    required
            />
        </div>

        <div class="form-group">
            <label for="password">Mật khẩu</label>
            <input
                    type="password"
                    id="password"
                    name="password"
                    th:field="*{password}"
                    placeholder="Nhập mật khẩu..."
                    autocomplete="current-password"
                    required
            />
        </div>

        <button type="submit" class="btn-login" id="btn-login">
            Đăng nhập
        </button>

    </form>

    <div class="demo-hint">
        Demo: <strong>admin</strong> / <strong>123456</strong>
    </div>
</div>

</body>
</html>
